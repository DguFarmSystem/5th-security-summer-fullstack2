<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <div class="profile-img">
            <img src="https://via.placeholder.com/150" alt="프로필 이미지">
        </div>
        
        <div class="profile-info">
            <h1>이준민</h1>
            <p class="role">Server Administrator & DBA 지망생</p>
            <p class="bio">안녕하세요! 정보통신공학전공 백엔드 및 인프라 공부를 하고 있는 학생입니다.</p>
        </div>

        <div class="section">
            <h2>관심 기술 스택</h2>
            <div class="tags">
                <span>Java</span>
                <span>Spring</span>
                <span>MySQL</span>
                <span>Linux</span>
            </div>
        </div>

        <div class="section">
            <h2>MBTI 및 성향</h2>
            <p>열정적이고 도전적인 문제 해결을 좋아하는 성향입니다.</p>
        </div>
    </div>
</body>
</html>
